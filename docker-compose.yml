services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      - DB=${DB}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - web
    restart: always

  # frontend:
  #   build: ../CSCI_3916_REACTAPPPROJ_HARRISON_JULIUS
  #   networks:
  #     - web
  #   restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - web
    restart: always
    depends_on:
      - backend

networks:
  web:
    driver: bridge
